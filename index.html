<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>營養記錄</title>
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="營養記錄">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#f4f3ef;--card:#fff;--sunk:#efeee9;--fg:#1c211e;--muted:#6b726d;--line:#e4e3dd;
  --accent:#2c7a57;--accent-soft:#e3f0e8;--on-accent:#fff;
  --p:#3f78d1;--c:#e09a1f;--f:#d9604f;--warn:#b86a12;--err:#c2412f;--ok:#2c7a57;
  --radius:18px;--shadow:0 1px 2px rgba(20,30,25,.05),0 4px 16px rgba(20,30,25,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111412;--card:#1b1f1c;--sunk:#232825;--fg:#e9ede9;--muted:#9aa39d;--line:#2b312d;
  --accent:#57b98a;--accent-soft:#1f3329;--on-accent:#0c120f;
  --p:#6e9ff0;--c:#f0b246;--f:#ef8577;--warn:#e5a457;--err:#f08776;--ok:#57b98a;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",system-ui,sans-serif;
  padding:env(safe-area-inset-top) 0 calc(92px + env(safe-area-inset-bottom));font-variant-numeric:tabular-nums}
main{max-width:560px;margin:0 auto;padding:8px 16px 16px}
h1{font-size:26px;font-weight:700;margin:12px 0 16px;letter-spacing:.5px}
h2{font-size:15px;font-weight:600;color:var(--muted);margin:24px 4px 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-weight:400;font-size:13px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,select{width:100%;min-width:0;background:var(--sunk);border:1.5px solid transparent;border-radius:12px;padding:11px 12px;font-size:17px;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus{border-color:var(--accent);background:var(--card)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card+.card{margin-top:12px}
.muted{color:var(--muted)}.small{font-size:13px}
.warn{color:var(--warn)}.err{color:var(--err)}.ok{color:var(--ok)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:600;font-size:16px;background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.block{width:100%}
.btn svg{width:20px;height:20px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.icon-btn{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.on{color:var(--c)}

/* 日期列 */
.datebar{display:flex;align-items:center;justify-content:space-between;margin:8px 0 12px}
.datebar .label{font-size:22px;font-weight:700;position:relative}
.datebar .label small{display:block;font-size:13px;font-weight:400;color:var(--muted)}
.datebar input{position:absolute;inset:0;opacity:0}

/* 熱量圓環 */
.hero{display:flex;gap:18px;align-items:center}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--sunk)}.ring .val{stroke:var(--accent);transition:stroke-dashoffset .5s}
.ring.over .val{stroke:var(--err)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-size:28px;font-weight:700;line-height:1.1}
.ring .cap{font-size:12px;color:var(--muted)}
.hero .facts{flex:1;display:grid;gap:10px}
.fact span{display:block;font-size:13px;color:var(--muted)}.fact b{font-size:20px}
.fact b small{font-size:13px;font-weight:400;color:var(--muted);margin-left:2px}
.cta{display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px;border-radius:14px;background:var(--accent-soft);color:var(--accent);font-size:14px;font-weight:600;width:100%;text-align:left}

.plan-line{display:flex;justify-content:space-between;margin-top:14px;padding:10px 12px;border-radius:12px;background:var(--sunk);font-size:13px;color:var(--muted)}
.plan-line b{color:var(--fg);font-weight:600}

/* 營養素條 */
.macros{display:grid;gap:14px;margin-top:4px}
.macro .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.macro .top b{font-weight:600}.macro .top span{color:var(--muted)}
.meter{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;border-radius:5px;transition:width .5s}
.macro.p i{background:var(--p)}.macro.c i{background:var(--c)}.macro.f i{background:var(--f)}
.minor{display:flex;gap:16px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.minor b{color:var(--fg);font-weight:600}

/* 餐別與項目 */
.meal{padding:4px 0}
.meal-head{display:flex;justify-content:space-between;align-items:baseline;padding:8px 16px 4px;font-weight:600}
.meal-head small{color:var(--muted);font-weight:400}
.item{display:flex;align-items:center;gap:4px;padding:10px 8px 10px 16px;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{display:block;color:var(--muted);font-size:13px}
.item .kcal{font-weight:600;white-space:nowrap;margin-right:2px}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--sunk);color:var(--warn);margin-left:4px;vertical-align:1px}
.empty{text-align:center;color:var(--muted);padding:28px 16px;font-size:15px}
.hint{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:14px;margin-bottom:12px;border-left:4px solid var(--warn)}

/* 分段選擇 */
.seg{display:flex;background:var(--sunk);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border-radius:10px;font-size:15px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--card);color:var(--fg);font-weight:600;box-shadow:var(--shadow)}

/* 新增頁 */
.capture{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.capture .main{grid-column:1/-1;min-height:120px;flex-direction:column;font-size:18px;border-radius:var(--radius)}
.capture .main svg{width:36px;height:36px}
.capture label{cursor:pointer}.capture input{display:none}
.quick{display:grid;gap:0;padding:4px 0}
.qitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 16px;border-top:1px solid var(--line)}
.qitem:first-child{border-top:0}
.qitem small{color:var(--muted);white-space:nowrap}
.qitem .plus{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none;font-size:20px;font-weight:600}

/* 編輯卡 */
#editor:empty{display:none}
#editor{margin-bottom:8px}
.thumb{width:100%;max-height:200px;object-fit:cover;border-radius:14px;display:block;margin-bottom:10px}
.note{font-size:14px;color:var(--muted);margin:6px 2px 10px}
.busy{display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 0;color:var(--muted)}
.spinner{width:34px;height:34px;border:3px solid var(--sunk);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.edit{display:grid;gap:12px;border:0;margin:0 0 12px}
.edit .head{display:flex;align-items:center;gap:10px}
.edit .name{font-weight:600}
.check-inc{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);white-space:nowrap}
.check-inc input{width:20px;height:20px;accent-color:var(--accent);-webkit-appearance:auto;appearance:auto;padding:0}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:12px;background:var(--sunk);font-size:22px;font-weight:600}
.stepper input{width:72px;text-align:center;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;background:var(--sunk);font-size:14px}
.nut{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.nut label{font-size:13px;color:var(--muted);display:grid;gap:4px}
.nut input{padding:9px 10px;font-size:16px}
.conf{font-size:13px}
.sum{font-size:14px;padding:10px 12px;border-radius:12px;background:var(--sunk)}
.actions{display:flex;gap:10px;margin-top:4px}
.actions .btn{flex:1}

/* 表單 */
.form{display:grid;gap:14px}
.form label{display:grid;gap:6px;font-size:14px;color:var(--muted);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.unit{position:relative}.unit input{padding-right:34px}
.unit em{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:14px;pointer-events:none}

/* 結果 */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--sunk);border-radius:14px;padding:12px}
.kpi span{font-size:13px;color:var(--muted);display:block}
.kpi b{font-size:22px}.kpi b small{font-size:13px;font-weight:400;color:var(--muted);margin-left:2px}
.kpi.main{grid-column:1/-1;background:var(--accent-soft)}
.kpi.main b{font-size:30px;color:var(--accent)}
.explain{font-size:14px;color:var(--muted);margin:12px 2px 0;line-height:1.65}
.explain li{margin-bottom:4px}

/* 分析 */
.chart{width:100%;height:auto;display:block}
.chart .bar{fill:var(--accent)}.chart .bar.over{fill:var(--err)}
.chart .tl{stroke:var(--muted);stroke-dasharray:4 4}
.chart text{fill:var(--muted);font-size:10px}
.contrib{display:grid;grid-template-columns:1fr 90px auto;gap:10px;align-items:center;font-size:14px;padding:6px 0}
.contrib span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.contrib small{color:var(--muted);white-space:nowrap}
.mini{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}.mini i{display:block;height:100%;background:var(--accent)}
.verdict{font-size:15px;line-height:1.6}

/* 底部導覽 */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-top:1px solid var(--line);padding:6px 8px env(safe-area-inset-bottom)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 8px;font-size:11px;color:var(--muted)}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--accent);font-weight:600}
nav .fab{transform:translateY(-14px)}
nav .fab span{width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(44,122,87,.35)}
nav .fab svg{width:28px;height:28px}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;max-width:90%;z-index:9}
#toast.show{opacity:1;transform:translateX(-50%)}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <!-- 今日 -->
  <section id="today" class="tab">
    <div class="datebar">
      <button class="icon-btn" id="prev" aria-label="前一天"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div class="label" style="text-align:center"><span id="dateLabel"></span><small id="dateSub"></small><input type="date" id="date" aria-label="選擇日期"></div>
      <button class="icon-btn" id="next" aria-label="後一天"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div id="backupHint" class="hint" hidden><span>超過 7 天沒有備份資料</span><button class="btn soft" style="min-height:36px;padding:0 12px" id="gotoBackup">去備份</button></div>
    <div class="card" id="summary"></div>
    <div id="entries"></div>
  </section>

  <!-- 新增 -->
  <section id="add" class="tab" hidden>
    <h1>新增 <small class="muted" style="font-size:15px;font-weight:400" id="addDate"></small></h1>
    <div class="seg" id="mealSeg" role="tablist" aria-label="餐別"></div>
    <div style="height:12px"></div>
    <div id="editor"></div>
    <div class="capture" id="capture">
      <label class="btn primary main"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>拍照辨識<small style="font-weight:400;opacity:.85;font-size:13px">食物或營養標示</small><input type="file" id="cam" accept="image/*" capture="environment"></label>
      <label class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 16l5-5 4 4 3-3 4 4"/></svg>相簿<input type="file" id="lib" accept="image/*"></label>
      <button class="btn" id="manual"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 19h4L19 9l-4-4L5 15z"/></svg>手動輸入</button>
    </div>
    <h2>常用與最近 <small>點一下加入</small></h2>
    <div class="card" style="padding:0"><div id="quick" class="quick"></div></div>
  </section>

  <!-- 分析 -->
  <section id="stats" class="tab" hidden>
    <h1>分析</h1>
    <div class="seg" id="rangeSeg"><button data-v="7" class="on">7 天</button><button data-v="14">14 天</button><button data-v="30">30 天</button></div>
    <div id="statsBody"></div>
  </section>

  <!-- 身體 -->
  <section id="body" class="tab" hidden>
    <h1>身體與目標</h1>
    <div id="planTop"></div>
    <div class="card form" id="profileForm">
      <label>生理性別<div class="seg" id="sexSeg"><button data-v="male">男</button><button data-v="female">女</button></div></label>
      <div class="grid3">
        <label>年齡<div class="unit"><input type="number" inputmode="numeric" id="pAge" placeholder="35"><em>歲</em></div></label>
        <label>身高<div class="unit"><input type="number" inputmode="decimal" id="pHeight" placeholder="183"><em>cm</em></div></label>
        <label>體重<div class="unit"><input type="number" inputmode="decimal" id="pWeight" placeholder="80"><em>kg</em></div></label>
      </div>
      <label>體脂率（選填，有的話更準）<div class="unit"><input type="number" inputmode="decimal" id="pBodyFat" placeholder="例如 20"><em>%</em></div></label>
      <label>日常活動量<select id="pActivity"></select></label>
      <label>目標<div class="seg" id="rateSeg"></div></label>
    </div>
    <div id="planBody"></div>
  </section>

  <!-- 設定 -->
  <section id="settings" class="tab" hidden>
    <h1>設定</h1>
    <div class="card form">
      <div><b>照片辨識</b><p class="muted small" style="margin:4px 0 0">使用 Google Gemini 免費 API。到 <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a> 申請 Key，只存在這支手機上。</p></div>
      <label>API Key<input type="password" id="apiKey" autocomplete="off" placeholder="AIza…"></label>
      <label>辨識模式<div class="seg" id="speedSeg"><button data-v="balanced">平衡</button><button data-v="fast">最快</button></div><span class="small muted" style="font-weight:400">「最快」使用輕量模型，標示辨識幾乎一樣準，食物照估算稍弱。</span></label>
      <label>進階：指定模型（可留空）<input id="model" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="自動"></label>
      <button class="btn primary block" id="saveKey">儲存</button>
    </div>
    <div class="card form">
      <div><b>資料備份</b><p class="muted small" id="dataInfo" style="margin:4px 0 0"></p></div>
      <div class="grid2"><button class="btn primary" id="exportJson">備份 JSON</button><button class="btn" id="exportCsv">匯出 CSV</button></div>
      <label class="btn soft">還原備份<input type="file" id="importFile" accept="application/json,.json" hidden></label>
      <p class="muted small" style="margin:0">資料只存在手機瀏覽器內，移除 App 或清除網站資料會一起消失，請定期備份。</p>
    </div>
  </section>
</main>

<nav><div class="in">
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>今日</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>分析</button>
  <button data-tab="add" class="fab" aria-label="新增紀錄"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></button>
  <button data-tab="body"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="6" r="2.5"/><path d="M6 10h12M12 10v5M9 21l3-6 3 6"/></svg>身體</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>設定</button>
</div></nav>
<div id="toast" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
